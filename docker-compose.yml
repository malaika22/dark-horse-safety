services:
  postgres:
    image: postgres:16-alpine
    container_name: dhs-postgres
    restart: unless-stopped
    ports:
      # Host 5433 avoids conflict with a local Windows Postgres on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: darkhorse
      POSTGRES_PASSWORD: darkhorse
      POSTGRES_DB: dark_horse_safety
    volumes:
      - dhs_pg_data:/var/lib/postgresql/data

volumes:
  dhs_pg_data:
